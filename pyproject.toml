[project]
name = "ai-tutor"
version = "0.0.1"
description = "Local-only AI tutor that teaches one skill at a time from my own books"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.139",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "openai>=1.40",
  "pymupdf>=1.24",
  "sqlite-vec>=0.1.9",
  "python-multipart>=0.0.32",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Local embeddings (TASKS_002): uv sync --extra embed. Run in float32 or bfloat16, never float16.
embed = ["sentence-transformers>=6.1", "transformers>=5.0", "torch>=2.4", "torchvision>=0.19", "pillow>=10.0"]
# Video transcripts (TASKS_007): uv sync --extra media
media = ["faster-whisper>=1.0"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C408", "E701", "E702", "E731"]

# CPU-only PyTorch for the `embed` extra: the language model server has the GPU, and the CPU wheel is ~200 MB instead of several GB.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
